<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AI Qadam Events — мок Mini App</title>
    <!-- Бренд — из вендоренной копии miniapp/src/vendor/brand/ (ADR-0026). -->
    <link rel="stylesheet" href="vendor/tokens.css" />
    <link rel="stylesheet" href="vendor/components.css" />
    <link rel="stylesheet" href="proto.css" />
  </head>
  <body class="proto-body">
    <div class="proto-wrap">
      <div class="proto-bar" data-proto-bar></div>
      <div class="proto-warn" data-proto-warn hidden>Словарь i18n/ru.json не загрузился — на экране сырые ключи.</div>

      <div class="proto-stage">
        <div class="tgv">
          <div class="tgv-bar">
            <a class="tgv-close" data-proto-close href="index.html">Закрыть</a>
            <span class="tgv-title" id="app-bar-title">Mini App</span>
            <span class="tgv-more" aria-hidden="true">⋯</span>
          </div>
          <div class="tgv-screen" id="screen"></div>
        </div>
      </div>

      <div class="proto-demo" data-proto-demo></div>
    </div>

    <div class="proto-trace" data-proto-trace-panel hidden>
      <div class="proto-trace-head">
        <span class="proto-trace-title">Требования SPEC</span>
        <button type="button" class="proto-btn proto-btn-ghost" data-proto-trace-close>Закрыть</button>
      </div>
      <div class="proto-trace-note">Слой трассировки. На самих экранах пометок нет — это прототип, а не продукт.</div>
      <div class="proto-trace-body" data-proto-trace-body></div>
    </div>

    <script src="proto.js"></script>
    <script src="data.js"></script>
    <script src="scenarios.js"></script>
    <script src="app.js"></script>
    <script>
      document.querySelector('[data-proto-trace-close]').addEventListener('click', PROTO.toggleTrace);
    </script>
  </body>
</html>
