<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Qadam Events</title>
  <link rel="preconnect" href="https://app.flow.aiqadam.org" crossorigin>
  <link rel="stylesheet" href="vendor/aiqadam-brand-subset.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="i18n.js"></script>
  <style>
    /* Раскладка; цвет, шрифт и радиусы — только токенами бренда (ADR-0019 п. 2),
       длины — по 4-пиксельной шкале бренда, ни одного литерала цвета и шрифта. */
    /* Без этого `.btn { display: inline-flex }` бренда перебивает UA-правило
       для [hidden], и скрытая кнопка «Повторить» остаётся на экране. */
    [hidden] { display: none !important; }
    main { max-width: 384px; margin: 0 auto; padding: 16px; text-align: center; }
    .ticket-card { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    /* Плита QR принудительно в светлой теме бренда. Правило бренда, тот же
       раздел «Event stands → QR codes»: «Dark code on light ground. Never teal.»
       (https://brand.aiqadam.org/brand.html#stands). Сам код у qrcode.js всегда
       чёрный на белом — тёмной в системной тёмной теме стала бы подложка вокруг
       него, то есть зона покоя, а с ней и сканируемость.

       `padding: 32px` — зона покоя. Правило не наше: бренд формулирует его
       в разделе «Event stands → QR codes» — «Quiet zone: four modules, always.
       The empty margin around the code is part of the code»
       (https://brand.aiqadam.org/brand.html#stands). Payload — `c<eventId>-<userId>-<sig>`, и его
       границы заданы не на глаз, а парсером: `eventId` — слаг
       `/^[A-Za-z0-9_]{1,12}$/`, `userId` — до 16 цифр, `sig` — 10 знаков
       (`catalog/snippets/hmac-qr.md`; `fn-sign-qr` на всём остальном падает).
       Значит 15–41 знак, что при уровне коррекции H (умолчание qrcode.js)
       даёт 29–37 модулей. Худший случай — самый крупный модуль, то есть
       самый короткий payload: 224/29 ≈ 7,7 px, зона покоя ≈ 4,1 модуля.
       Прежние 16 px давали вдвое меньше. */
    .qr-plate {
      /* Тянется во всю ширину карточки: иначе плита сжимается по картинке,
         и «доступная ширина» для размера кода считать неоткуда. */
      align-self: stretch;
      padding: 32px;
      border-radius: var(--radius-lg);
      background: var(--card);
      border: 1px solid var(--border);
      min-height: 224px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-plate img, .qr-plate canvas { display: block; }
    .msg { margin: 16px 0 0; }
    /* Отказ оформлен так же, как вердикт на сканере: тон несёт рамка и полоса
       карточки, текст остаётся `--foreground`. Акцентный токен текстом на
       `--card` давал 4,65:1 — впритык к порогу для 14 px (W30, круг 5 и 7). */
    .ticket-card.error { border-color: var(--destructive); box-shadow: inset 0 4px 0 var(--destructive); }
    .ticket-card.error .msg { color: var(--foreground); }
    .ticket-card > .btn { margin-top: 0; }
  </style>
</head>
<body>
  <main>
    <div class="card ticket-card">
      <h1 class="empty-heading" id="title"></h1>
      <div class="qr-plate" data-theme="light" id="qr"></div>
      <p class="empty-desc msg" id="status" role="status"></p>
      <button type="button" class="btn btn-secondary" id="retry" hidden></button>
    </div>
  </main>
  <script>
    (function () {
      'use strict';
      // ADR-0007: QR рендерится здесь из payload'а my-qr-api, файл не отправляется.
      var API_URL = 'https://app.flow.aiqadam.org/api/v1/webhooks/WYmnxVM4xPAWZA1IvNZok/sync';
      var FETCH_TIMEOUT_MS = 15000;

      var tg = window.Telegram && window.Telegram.WebApp;
      var dict = {};
      var statusEl = document.getElementById('status');
      var qrEl = document.getElementById('qr');
      var titleEl = document.getElementById('title');
      var cardEl = qrEl.parentNode;
      var retryBtn = document.getElementById('retry');

      function t(key) {
        return dict[key] || key;
      }

      // Тема — из Telegram, механизмом самого бренда ([data-theme]).
      // Без JS остаётся светлая тема из `:root`, страница читается.
      function applyTheme() {
        var scheme = tg && tg.colorScheme === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', scheme);
      }

      function showError(text, retryable) {
        statusEl.textContent = text;
        cardEl.className = 'card ticket-card error';
        retryBtn.hidden = !retryable;
      }

      function showStatus(key) {
        statusEl.textContent = t(key);
        cardEl.className = 'card ticket-card';
        retryBtn.hidden = true;
      }

      // Размер кода — по доступной ширине, но не крупнее 224 px. На узком
      // экране (320 px) фиксированные 224 не помещаются в карточку вместе
      // с зоной покоя, и плита вылезала за её рамку. Код перерисовывается
      // под размер, а не растягивается из картинки другого размера. (Битмап
      // всё равно рисуется в CSS-пикселях: qrcode.js не учитывает DPR, так
      // что на экране 3× он интерполируется. Декодированию это не мешает —
      // проверено, — но «резко» здесь значит «без двойного масштабирования».)
      //
      // Пересчёт обязателен не только при первом показе. Ширина плиты меняется
      // после рендера — поворот экрана, смена высоты вьюпорта Telegram, первый
      // замер в ещё не разложенном поддереве (тогда clientWidth == 0). Код,
      // посчитанный один раз, в этих случаях остаётся крупнее плиты, и зона
      // покоя падает ниже нормы, ради которой всё и делалось.
      var QR_MAX = 224;
      var qrPayload = '';
      var qrDrawn = 0;

      function qrSize() {
        var inner = qrEl.clientWidth - 64; // 2 × padding плиты
        if (!(inner > 0)) { return QR_MAX; } // ещё нечего мерить — исправит пересчёт
        return Math.min(QR_MAX, Math.floor(inner));
      }

      function drawQr() {
        if (!qrPayload) { return; }
        var size = qrSize();
        if (size === qrDrawn) { return; }
        qrDrawn = size;
        // Без innerHTML: страница ничего не собирает разметкой из данных.
        while (qrEl.firstChild) { qrEl.removeChild(qrEl.firstChild); }
        new QRCode(qrEl, { text: qrPayload, width: size, height: size });
      }

      function renderQr(payload) {
        qrPayload = payload;
        drawQr();
        if (window.ResizeObserver) {
          new ResizeObserver(drawQr).observe(qrEl);
        } else {
          window.addEventListener('resize', drawQr);
          window.addEventListener('orientationchange', drawQr);
        }
      }

      if (tg) {
        applyTheme();
        tg.ready();
        tg.expand();
        if (tg.onEvent) { tg.onEvent('themeChanged', applyTheme); }
      }

      var params = new URLSearchParams(window.location.search);
      var eventId = params.get('event_id') || '';
      var initData = tg && tg.initData ? tg.initData : '';

      // Запрос QR с таймаутом. Три исхода различаются: нет соединения или
      // таймаут (`network`), сервер ответил не-JSON — например, 5xx-страницей
      // (`server`), сервер ответил JSON (`json`). Раньше все три показывались
      // как «Нет соединения» и без выхода из «Загрузка…» (W30, круг 7, п. 4).
      function requestQr() {
        var ctrl = window.AbortController ? new AbortController() : null;
        var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, FETCH_TIMEOUT_MS) : 0;
        return fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: initData, eventId: eventId }),
          signal: ctrl ? ctrl.signal : undefined
        }).then(function (r) {
          return r.text().then(function (raw) {
            var data = null;
            try { data = JSON.parse(raw); } catch (e) { data = null; }
            return (data && typeof data === 'object') ? { kind: 'json', data: data } : { kind: 'server' };
          });
        }).catch(function () {
          return { kind: 'network' };
        }).then(function (res) {
          if (timer) clearTimeout(timer);
          return res;
        });
      }

      function handleQr(res) {
        if (res.kind === 'network') { showError(t('ticket.error.network'), true); return; }
        if (res.kind === 'server') { showError(t('ticket.error.server'), true); return; }
        var data = res.data;
        if (data.ok && data.payload) {
          renderQr(data.payload);
          showStatus('ticket.show_at_entrance');
        } else if (data.error === 'not_registered' || data.error === 'invalid_init_data') {
          showError(typeof data.text === 'string' && data.text ? data.text : t('ticket.error.unknown'), false);
        } else {
          showError(t('ticket.error.unknown'), true);
        }
      }

      function retry() {
        showStatus('ticket.loading');
        requestQr().then(handleQr);
      }

      // QR запрашивается сразу, не дожидаясь словаря: на плохой связи это
      // единственное, ради чего страницу открыли. Словарь приезжает параллельно
      // и только подставляет подписи — сырой ключ на экране заметен, пустой нет.
      var qrRequest = null;
      if (tg && initData && eventId) {
        qrRequest = requestQr();
      }

      MiniAppI18n.load(function (err, d) {
        dict = d;
        document.title = t('ticket.title');
        titleEl.textContent = t('ticket.title');

        if (!tg || !initData) {
          showError(t('ticket.not_in_telegram'));
          return;
        }
        if (!eventId) {
          showError(t('ticket.no_event'));
          return;
        }
        // Словарь мог не доехать (err) — подписи будут сырыми ключами,
        // но QR всё равно запрошен и всё равно будет показан.
        retryBtn.textContent = t('ticket.retry');
        retryBtn.addEventListener('click', retry);
        showStatus('ticket.loading');

        qrRequest.then(handleQr);
      });
    })();
  </script>
</body>
</html>
