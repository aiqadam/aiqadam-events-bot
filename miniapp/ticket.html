<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Qadam Events</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="i18n.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font: 16px/1.5 system-ui, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #111111);
    }
    main { max-width: 24rem; margin: 0 auto; padding: 1.25rem; text-align: center; }
    h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 0.5rem; }
    #qr { display: flex; justify-content: center; margin: 1.5rem 0; min-height: 200px; }
    #status {
      color: var(--tg-theme-hint-color, #666666);
      min-height: 1.5em;
    }
    #status.error { color: #b00020; }
  </style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <div id="qr"></div>
    <p id="status"></p>
  </main>
  <script>
    (function () {
      'use strict';
      // ADR-0007: QR рендерится здесь из payload'а my-qr-api, файл не отправляется.
      var API_URL = 'https://app.flow.aiqadam.org/api/v1/webhooks/I5nd8ggKH4wkQLaww9Dkl/sync';

      var tg = window.Telegram && window.Telegram.WebApp;
      var dict = {};
      var statusEl = document.getElementById('status');
      var qrEl = document.getElementById('qr');
      var titleEl = document.getElementById('title');

      function t(key) {
        return dict[key] || key;
      }

      function showError(text) {
        statusEl.textContent = text;
        statusEl.className = 'error';
      }

      function showStatus(key) {
        statusEl.textContent = t(key);
        statusEl.className = '';
      }

      MiniAppI18n.load(function (err, d) {
        dict = d;
        document.title = t('ticket.title');
        titleEl.textContent = t('ticket.title');
        if (err) { showError(t('ticket.error.unknown')); return; }

        if (tg) {
          tg.ready();
          tg.expand();
        }

        var params = new URLSearchParams(window.location.search);
        var eventId = params.get('event_id') || '';
        var initData = tg && tg.initData ? tg.initData : '';

        if (!tg || !initData) {
          showError(t('ticket.not_in_telegram'));
        } else if (!eventId) {
          showError(t('ticket.no_event'));
        } else {
          showStatus('ticket.loading');
          fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData: initData, eventId: eventId }),
          })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data && data.ok && data.payload) {
                new QRCode(qrEl, {
                  text: data.payload,
                  width: 220,
                  height: 220,
                });
                showStatus('ticket.show_at_entrance');
              } else if (data && (data.error === 'not_registered' || data.error === 'invalid_init_data')) {
                showError(typeof data.text === 'string' && data.text ? data.text : t('ticket.error.unknown'));
              } else {
                showError(t('ticket.error.unknown'));
              }
            })
            .catch(function () {
              showError(t('ticket.error.network'));
            });
        }
      });
    })();
  </script>
</body>
</html>
