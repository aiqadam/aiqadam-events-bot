<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Qadam Events</title>
  <link rel="preconnect" href="https://app.flow.aiqadam.org" crossorigin>
  <link rel="stylesheet" href="vendor/aiqadam-brand-subset.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="i18n.js"></script>
  <style>
    /* Только раскладка. Цвет, шрифт и радиусы — токенами бренда (ADR-0019 п. 2),
       длины — по 4-пиксельной шкале бренда, своих значений тут нет. */
    main { max-width: 384px; margin: 0 auto; padding: 16px; text-align: center; }
    .ticket-card { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    /* Плита QR принудительно в светлой теме бренда: чёрный код на светлой
       подложке читается сканером и при системной тёмной. Тёмный QR не сканируется.

       `padding: 32px` — зона покоя кода, а не воздух: QR требует вокруг себя
       ≥ 4 модулей светлого поля. Реальный payload — `c<eventId>-<userId>-<sig>`,
       где `eventId` это record id платформы в 21 знак: около 44 знаков, что
       при уровне коррекции H (умолчание qrcode.js) даёт 41 модуль, то есть
       модуль 224/41 ≈ 5,5 px и зону покоя ≈ 5,9 модуля. Худший случай —
       самый крупный модуль, то есть теоретический минимальный payload
       в 29 модулей: 224/29 ≈ 7,7 px, зона покоя ≈ 4,15 модуля — всё ещё
       норма. Прежние 16 px давали вдвое меньше. */
    .qr-plate {
      /* Тянется во всю ширину карточки: иначе плита сжимается по картинке,
         и «доступная ширина» для размера кода считать неоткуда. */
      align-self: stretch;
      padding: 32px;
      border-radius: var(--radius-lg);
      background: var(--card);
      border: 1px solid var(--border);
      min-height: 224px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-plate img, .qr-plate canvas { display: block; }
    .msg { margin: 16px 0 0; }
    .msg.error { color: var(--destructive); }
  </style>
</head>
<body>
  <main>
    <div class="card ticket-card">
      <h1 class="empty-heading" id="title"></h1>
      <div class="qr-plate" data-theme="light" id="qr"></div>
      <p class="empty-desc msg" id="status" role="status"></p>
    </div>
  </main>
  <script>
    (function () {
      'use strict';
      // ADR-0007: QR рендерится здесь из payload'а my-qr-api, файл не отправляется.
      var API_URL = 'https://app.flow.aiqadam.org/api/v1/webhooks/WYmnxVM4xPAWZA1IvNZok/sync';

      var tg = window.Telegram && window.Telegram.WebApp;
      var dict = {};
      var statusEl = document.getElementById('status');
      var qrEl = document.getElementById('qr');
      var titleEl = document.getElementById('title');

      function t(key) {
        return dict[key] || key;
      }

      // Тема — из Telegram, механизмом самого бренда ([data-theme]).
      // Без JS остаётся светлая тема из `:root`, страница читается.
      function applyTheme() {
        var scheme = tg && tg.colorScheme === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', scheme);
      }

      function showError(text) {
        statusEl.textContent = text;
        statusEl.className = 'empty-desc msg error';
      }

      function showStatus(key) {
        statusEl.textContent = t(key);
        statusEl.className = 'empty-desc msg';
      }

      // Размер кода — по доступной ширине, но не крупнее 224 px. На узком
      // экране (320 px) фиксированные 224 не помещаются в карточку вместе
      // с зоной покоя, и плита вылезала за её рамку. Код перерисовывается
      // под размер, а не масштабируется картинкой: модули остаются резкими.
      //
      // Пересчёт обязателен не только при первом показе. Ширина плиты меняется
      // после рендера — поворот экрана, смена высоты вьюпорта Telegram, первый
      // замер в ещё не разложенном поддереве (тогда clientWidth == 0). Код,
      // посчитанный один раз, в этих случаях остаётся крупнее плиты, и зона
      // покоя падает ниже нормы, ради которой всё и делалось.
      var QR_MAX = 224;
      var qrPayload = '';
      var qrDrawn = 0;

      function qrSize() {
        var inner = qrEl.clientWidth - 64; // 2 × padding плиты
        if (!(inner > 0)) { return QR_MAX; } // ещё нечего мерить — исправит пересчёт
        return Math.min(QR_MAX, Math.floor(inner));
      }

      function drawQr() {
        if (!qrPayload) { return; }
        var size = qrSize();
        if (size === qrDrawn) { return; }
        qrDrawn = size;
        // Без innerHTML: страница ничего не собирает разметкой из данных.
        while (qrEl.firstChild) { qrEl.removeChild(qrEl.firstChild); }
        new QRCode(qrEl, { text: qrPayload, width: size, height: size });
      }

      function renderQr(payload) {
        qrPayload = payload;
        drawQr();
        if (window.ResizeObserver) {
          new ResizeObserver(drawQr).observe(qrEl);
        } else {
          window.addEventListener('resize', drawQr);
          window.addEventListener('orientationchange', drawQr);
        }
      }

      if (tg) {
        applyTheme();
        tg.ready();
        tg.expand();
        if (tg.onEvent) { tg.onEvent('themeChanged', applyTheme); }
      }

      var params = new URLSearchParams(window.location.search);
      var eventId = params.get('event_id') || '';
      var initData = tg && tg.initData ? tg.initData : '';

      // QR запрашивается сразу, не дожидаясь словаря: на плохой связи это
      // единственное, ради чего страницу открыли. Словарь приезжает параллельно
      // и только подставляет подписи — сырой ключ на экране заметен, пустой нет.
      var qrRequest = null;
      if (tg && initData && eventId) {
        qrRequest = fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: initData, eventId: eventId }),
        }).then(function (r) { return r.json(); });
      }

      MiniAppI18n.load(function (err, d) {
        dict = d;
        document.title = t('ticket.title');
        titleEl.textContent = t('ticket.title');

        if (!tg || !initData) {
          showError(t('ticket.not_in_telegram'));
          return;
        }
        if (!eventId) {
          showError(t('ticket.no_event'));
          return;
        }
        // Словарь мог не доехать (err) — подписи будут сырыми ключами,
        // но QR всё равно запрошен и всё равно будет показан.
        showStatus('ticket.loading');

        qrRequest
          .then(function (data) {
            if (data && data.ok && data.payload) {
              renderQr(data.payload);
              showStatus('ticket.show_at_entrance');
            } else if (data && (data.error === 'not_registered' || data.error === 'invalid_init_data')) {
              showError(typeof data.text === 'string' && data.text ? data.text : t('ticket.error.unknown'));
            } else {
              showError(t('ticket.error.unknown'));
            }
          })
          .catch(function () {
            showError(t('ticket.error.network'));
          });
      });
    })();
  </script>
</body>
</html>
