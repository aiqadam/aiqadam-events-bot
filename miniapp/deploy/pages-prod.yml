# ШАБЛОН prod-деплоя Mini App (W105, [ADR-0042](../../docs/adr/0042-two-environments-one-repo.md)).
#
# Почему отдельный репозиторий: GitHub Pages выдаёт TLS-сертификат на ОДИН
# кастомный домен на репозиторий, поэтому два домена (dev и prod) — это два
# репозитория. Здесь, в dev-репозитории, файл НЕ активен (лежит вне
# .github/workflows/): его место — репозиторий prod-Pages, ветка `prod`.
#
# Релиз prod = push/merge в ветку `prod` этого репозитория. Сборка — `build:prod`
# (miniapp/.env.prod: prod-хост + карта flowId prod).
name: pages-prod

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'miniapp/package-lock.json'
      - name: Build SPA (prod)
        working-directory: miniapp
        run: |
          npm ci
          npm run build:prod
      - name: Assemble site (dist + i18n)
        run: |
          mkdir -p _site/i18n
          cp -R miniapp/dist/. _site/
          cp -R i18n/. _site/i18n/
          if [ -f miniapp/CNAME ]; then cp miniapp/CNAME _site/CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
