# Prod-деплой Mini App (W105, ADR-0042).
#
# Этот файл лежит в ОТДЕЛЬНОМ репозитории prod-Pages, а не в aiqadam-events-bot:
# GitHub Pages даёт один кастомный домен на репозиторий, поэтому dev и prod — два
# репозитория. Исходник здесь не дублируется: шаг checkout берёт ветку `prod`
# репозитория aiqadam/aiqadam-events-bot (он публичный — токен не нужен).
#
# Релиз prod = продвинуть `prod`-ветку aiqadam-events-bot и запустить этот workflow
# (Actions → Run workflow, либо repository_dispatch `release-prod`).
name: pages-prod

on:
  workflow_dispatch:
  repository_dispatch:
    types: [release-prod]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source (aiqadam-events-bot@prod)
        uses: actions/checkout@v4
        with:
          repository: aiqadam/aiqadam-events-bot
          ref: prod
          path: src
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'src/miniapp/package-lock.json'
      - name: Build SPA (prod)
        working-directory: src/miniapp
        run: |
          npm ci
          npm run build:prod
      - name: Assemble site (dist + i18n)
        run: |
          mkdir -p _site/i18n
          cp -R src/miniapp/dist/. _site/
          cp -R src/i18n/. _site/i18n/
          # CNAME — из ЭТОГО (prod) репозитория, не из источника: в aiqadam-events-bot
          # лежит dev-домен, и копировать его сюда нельзя.
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
