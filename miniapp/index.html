<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Qadam Events</title>
  <link rel="preconnect" href="https://app.flow.aiqadam.org" crossorigin>
  <link rel="stylesheet" href="vendor/aiqadam-brand-subset.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="i18n.js"></script>
  <style>
    /* Только раскладка. Цвет и шрифт — токенами бренда (ADR-0019 п. 2),
       длины — по 4-пиксельной шкале бренда, своих значений тут нет. */
    [hidden] { display: none !important; }
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    main > * { width: 100%; }
    main > .btn { width: auto; }
    /* Строка состояния держит свою высоту пустой: без этого вердикт прыгает
       по вертикали в момент показа — на экране контролёра, сканирующего очередь. */
    #status { min-height: 1.5em; }
    /* Исход чекина — семантическими токенами бренда, а не своей палитрой:
       успех / предупреждение / отказ у бренда уже названы.
       Вердикт — это `.card`, а не `EmptyState`: пунктирная рамка «здесь пусто»
       у бренда значит отсутствие данных, а тут данные как раз есть. */
    .result.ok .empty-heading { color: var(--success); }
    .result.warn .empty-heading { color: var(--warning); }
    .result.bad .empty-heading { color: var(--destructive); }
    .result > :last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <h1 class="empty-heading" id="title"></h1>
    <div class="card result" id="result" role="status" hidden>
      <p class="empty-heading" id="resultText"></p>
      <p class="empty-desc" id="resultSub"></p>
    </div>
    <p class="empty-desc" id="status"></p>
    <button class="btn btn-primary btn-lg" id="rescan" hidden></button>
  </main>
  <script>
    (function () {
      'use strict';
      // Q14: events-dev, адрес фиксирован, см. docs/OPEN-QUESTIONS.md#q14.
      var API_URL = 'https://app.flow.aiqadam.org/api/v1/webhooks/rKoDYtiIVdbzlW59b57uH/sync';
      var RESULT_MS = 1600;

      // Исход чекина → тон бренда. Ключи — статусы checkin-api.
      var TONE = {
        ok: 'ok',
        already: 'warn',
        wrong_event: 'bad',
        not_registered: 'bad',
        invalid: 'bad',
        forbidden: 'bad',
        invalid_init_data: 'bad'
      };

      var tg = window.Telegram && window.Telegram.WebApp;
      var dict = {};
      var titleEl = document.getElementById('title');
      var resultEl = document.getElementById('result');
      var resultTextEl = document.getElementById('resultText');
      var resultSubEl = document.getElementById('resultSub');
      var statusEl = document.getElementById('status');
      var rescanBtn = document.getElementById('rescan');

      var eventId = '';
      var stopped = false;
      var inFlight = false;
      var lastPayload = '';
      var lastAt = 0;

      function t(key) {
        return dict[key] || key;
      }

      // Тема — из Telegram, механизмом самого бренда ([data-theme]).
      // Ставится до словаря и до любых проверок: отказ тоже должен быть
      // в правильной теме. Без JS остаётся светлая тема из `:root`.
      function applyTheme() {
        var scheme = tg && tg.colorScheme === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', scheme);
      }
      applyTheme();

      function closePopup() {
        if (tg && tg.closeScanQrPopup) {
          try { tg.closeScanQrPopup(); } catch (e) {}
        }
      }

      function setStatus(key) { statusEl.textContent = t(key); }

      function hideResult() {
        resultEl.hidden = true;
        resultEl.className = 'card result';
        resultSubEl.textContent = '';
      }

      function showResult(status, text, subKey) {
        resultEl.className = 'card result ' + (TONE[status] || 'bad');
        resultEl.hidden = false;
        resultTextEl.textContent = text;
        resultSubEl.textContent = subKey ? t(subKey) : '';
      }

      function offerRescan() {
        stopped = false;
        rescanBtn.textContent = t('scan.rescan');
        rescanBtn.hidden = false;
      }

      function stopAll(status, text, subKey) {
        stopped = true;
        hideResult();
        showResult(status, text, subKey);
        // Сканер остановлен — «Проверка…» под вердиктом врёт о том, что происходит.
        statusEl.textContent = '';
        closePopup();
      }

      function openScanner() {
        if (stopped) return;
        if (!tg || !tg.showScanQrPopup) {
          stopAll('forbidden', t('scan.unsupported'));
          return;
        }
        hideResult();
        setStatus('scan.hint');
        try {
          tg.showScanQrPopup({}, function () {
            var args = Array.prototype.slice.call(arguments);
            var err = args.length === 2 && typeof args[0] === 'string' ? args[0] : null;
            var result = args.length === 2 ? args[1] : args[0];
            if (err || !result) return;
            var text = typeof result === 'string' ? result : (result.text || result.data || '');
            onScanned(text);
          });
        } catch (e) {
          stopAll('forbidden', t('scan.unsupported'));
        }
      }

      function onScanned(text) {
        if (!text || stopped || inFlight) return;
        var now = Date.now();
        if (text === lastPayload && now - lastAt < 1400) return;
        lastPayload = text;
        lastAt = now;
        inFlight = true;
        closePopup();
        setStatus('scan.checking');
        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData, eventId: eventId, payload: text })
        })
          .then(function (r) {
            return r.json().then(function (d) {
              return { http: r.status, body: d };
            });
          })
          .then(function (res) {
            var d = res.body;
            inFlight = false;
            if (!d || typeof d !== 'object' || typeof d.text !== 'string') {
              stopAll('forbidden', t('scan.error_server'));
              offerRescan();
              return;
            }
            var st = d.status || '';
            if (st === 'invalid_init_data') {
              stopAll('invalid_init_data', d.text, 'scan.reopen_app');
            } else if (st === 'forbidden') {
              stopAll('forbidden', d.text);
            } else {
              showResult(st || 'already', d.text);
              setTimeout(function () {
                if (!stopped) openScanner();
              }, RESULT_MS);
            }
          })
          .catch(function () {
            inFlight = false;
            stopAll('forbidden', t('scan.network_error'));
            offerRescan();
          });
      }

      MiniAppI18n.load(function (err, d) {
        dict = d;
        document.title = t('scan.title');
        titleEl.textContent = t('scan.title');
        if (err) { stopAll('forbidden', t('scan.network_error')); return; }
        if (!tg || !tg.initData) { stopAll('forbidden', t('scan.not_in_telegram')); return; }
        eventId = new URLSearchParams(window.location.search).get('event_id') || '';
        if (!eventId) { stopAll('forbidden', t('scan.no_event')); return; }
        tg.ready();
        tg.expand();
        if (tg.onEvent) {
          tg.onEvent('themeChanged', applyTheme);
          tg.onEvent('scanQrPopupClosed', function () {
            if (!stopped && !inFlight) { setStatus('scan.hint'); offerRescan(); }
          });
        }
        rescanBtn.addEventListener('click', function () {
          rescanBtn.hidden = true;
          openScanner();
        });
        openScanner();
      });
    })();
  </script>
</body>
</html>
